[project]
name = "music-workbench"
version = "0.1.0"
description = "Music production toolkit: stem separation, chord detection, and MIDI harmony workspace"
authors = [{ name = "Vincent LE MEUR", email = "vincent.le-meur@metroscope.tech" }]
requires-python = ">=3.14,<3.15"

dependencies = [
    # --- Audio / separation stack (cp314 wheels exist for all of these) ---
    # numpy 2.2+ is required: numpy 1.x ships no cp314 wheels.
    "numpy>=2.2,<3",
    "scipy>=1.11.0",
    "librosa>=0.10.1,<0.11",
    "soundfile>=0.12.1",
    "sounddevice>=0.5.1",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "demucs-infer>=4.2.2",
    # Chord detection; scikit-learn is not imported directly here, but
    # madmom's ml module needs it without declaring it.
    "madmom @ git+https://github.com/CPJKU/madmom.git",
    "scikit-learn>=1.6,<2",
    # --- MIDI / harmony ---
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    # --- UI / visualization ---
    "streamlit>=1.36.0",
    "plotly>=5.18.0",
    "music21>=10.5.0",
    "verovio>=6.2.1",
]


[dependency-groups]
dev = [
    "prek>=0.4.0,<0.5.0",
    "pytest>=9.2.0",
    "ruff>=0.4.10",
    "ty>=0.0.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

# ---------------------
# Ruff
# ---------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "scripts"]
exclude = ["outputs", ".venv"]
fix = true

# ---------------------
# Ty
# ---------------------
# Ty configuration is done via command line or discovered automatically.
# Run: ty check src/ scripts/
# See: https://github.com/astral-sh/ty for configuration options.

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]

[tool.ruff.lint.isort]
known-first-party = [
    "music_workbench",
    "audio_analysis",
    "core",
    "harmony",
    "instrument_io",
]

[tool.ruff.format]
quote-style = "double"
